<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <!-- Jotform's widget library: must load before medical.js so the form's "ready" is heard. -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <link rel="stylesheet" href="widget.css">
  <style>
    /* The medical widget's own bits; everything else is widget.css. */
    .qm-inputs { grid-template-columns: repeat(2, minmax(0, 1fr)) auto; }
    .qm-tags { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; vertical-align: middle; }
    .qm-tag {
      font: 600 11px/1 Lato, system-ui, sans-serif;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--wash);
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
    }
    .qm-tag.is-new { background: var(--green-soft); border-color: var(--green); color: var(--green-deep); }
    .qm-facts { margin: 6px 0 0 28px; font-size: 13px; color: var(--muted); }
    .qm-facts b { color: var(--text); font-weight: 700; }
    .qm-plan.is-off { opacity: 0.55; }
    .qm-plan.is-off input { cursor: not-allowed; }
    .qm-why { margin: 6px 0 0 28px; padding: 4px 8px; border-radius: 6px; font-size: 12px; background: var(--wash); color: var(--muted); }
    .qm-why.is-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
    .qm-offline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .qm-picked { margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius); background: var(--green-soft); color: var(--green-deep); font-size: 14px; }
    .qm-picked ul { margin: 6px 0 0; padding-left: 18px; }
    .qm-search { display: block; margin: 0 0 12px; }
    .qm-search input {
      display: block;
      width: 100%;
      font: 15px/1.3 Lato, system-ui, sans-serif;
      color: var(--text);
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .qm-search input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
    .qm-search .qw-ask-hint { margin-top: 4px; }
    @media (max-width: 520px) {
      .qm-inputs { grid-template-columns: 1fr 1fr; }
      .qm-inputs label:first-child { grid-column: auto; }
      .qm-facts, .qm-why { margin-left: 0; }
    }
  </style>
</head>
<body>
  <section class="qw-inputs qm-inputs" aria-label="The group">
    <label>Effective date <input id="qm-date" placeholder="MM/DD/YYYY" autocomplete="off"></label>
    <label>Business ZIP code <input id="qm-zip" inputmode="numeric" maxlength="10" autocomplete="postal-code"></label>
    <button type="button" class="qw-btn" id="qm-refresh" hidden>Refresh</button>
  </section>
  <p class="qw-note" id="qm-note"></p>

  <div class="qw-warn" id="qm-place" role="status" hidden></div>

  <section class="qw-block" id="qm-county" aria-labelledby="qm-county-title" hidden>
    <h3 class="qw-h" id="qm-county-title">Which county is the business in?</h3>
    <p class="qw-note qw-note-top" id="qm-county-note"></p>
    <div class="qw-fchips" id="qm-county-chips"></div>
  </section>

  <div class="qw-errors" id="qm-errors" role="alert" hidden></div>

  <section class="qw-block" id="qm-menu" aria-labelledby="qm-title" hidden>
    <h3 class="qw-h" id="qm-title"></h3>
    <p class="qw-note qw-note-top" id="qm-menu-note"></p>
    <label class="qm-search" for="qm-search">
      <span class="qw-facet-label">Search plans</span>
      <input id="qm-search" type="search" autocomplete="off" spellcheck="false"
        placeholder="Type a plan code or name, e.g. s30, hsa g25, ppo gold">
      <span class="qw-ask-hint" id="qm-search-hint">Enter ticks the top match.</span>
    </label>
    <div id="qm-finder"></div>
    <div class="qw-line-plans" id="qm-plans"></div>
    <p class="qm-offline" id="qm-offline" hidden>
      <span id="qm-offline-text"></span>
      <button type="button" class="qw-linkbtn" id="qm-offline-toggle"></button>
    </p>
  </section>

  <div class="qm-picked" id="qm-picked" hidden></div>

  <!-- The form's q316 "funding methods" moved here (David 2026-10-31): shown once a plan is ticked. -->
  <section class="qw-block" id="qm-funding" aria-labelledby="qm-funding-title" hidden>
    <h3 class="qw-h" id="qm-funding-title"></h3>
    <div class="qw-fchips" id="qm-funding-chips"></div>
    <p class="qw-ask-hint">Pick both to have the plans quoted both ways.</p>
  </section>

  <details class="qw-debug" id="qm-debug" hidden open>
    <summary>Debug (widget setting debug = on)</summary>
    <pre id="qm-debug-log"></pre>
  </details>

  <script src="field-values.js"></script>
  <script src="bridge.js"></script>
  <script src="plan-view.js"></script>
  <script src="ph-sg-menu.js"></script>
  <script src="mi-zip-county.js"></script>
  <script src="medical-engine.js"></script>
  <script src="medical.js"></script>
</body>
</html>
